name: Quality
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: pip install -r backend/requirements.txt pytest==9.2.0 ruff==0.17.5
      - run: ruff check backend scripts tests && ruff format --check backend scripts tests && pytest -q
      - run: PYTHONPATH=backend python scripts/openapi.py --check && python scripts/check_repo.py
      - working-directory: frontend
        run: npm ci && npm run format && npm run build
      - run: scripts/lab up
      - working-directory: frontend
        run: npx playwright install --with-deps chromium && npm run e2e
      - run: scripts/lab reset && docker compose -p traceon-lab exec -T api python - < scripts/verify_workspace.py
      - if: failure()
        run: docker compose -p traceon-lab logs --no-color
      - if: always()
        run: docker compose -p traceon-lab down -v
