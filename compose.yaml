name: traceon
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: traceon
      POSTGRES_PASSWORD: traceon-local
      POSTGRES_DB: traceon
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h localhost -U traceon"]
      interval: 2s
      timeout: 3s
      retries: 25
    volumes:
      - data:/var/lib/postgresql/data
  api:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://traceon:traceon-local@db/traceon
      DEMO_PASSWORD: ${TRACEON_DEMO_PASSWORD:-Traceon-demo-local}
    command: ["/bin/sh", "-ec", "alembic upgrade head && python -m traceon.seed && exec uvicorn traceon.api:app --host 0.0.0.0"]
    healthcheck:
      test: ["CMD", "python", "-c", "from urllib.request import urlopen; urlopen('http://127.0.0.1:8000/health', timeout=2).close()"]
      retries: 30
      interval: 3s
      timeout: 3s
    depends_on:
      db:
        condition: service_healthy

  web:
    build: ./frontend
    ports:
      - "127.0.0.1:${TRACEON_PORT:-8100}:80"
    depends_on:
      api:
        condition: service_healthy

volumes:
  data:
