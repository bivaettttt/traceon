name: traceon
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: traceon
      POSTGRES_PASSWORD: traceon-local
      POSTGRES_DB: traceon
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h localhost -U traceon"]
      interval: 2s
      timeout: 3s
      retries: 25
    volumes:
      - data:/var/lib/postgresql/data
volumes:
  data:
